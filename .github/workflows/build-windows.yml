name: Build Windows

on:
  push:
    tags:
      - 'v*'
    # TEMP: remove `branches` block before merging to main
    branches:
      - test
  workflow_dispatch:
    inputs:
      standalone_version:
        description: 'mjml-standalone version (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build Windows x64 (node${{ matrix.node_version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [16, 18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (build host)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install yarn
        run: |
          npm install -g yarn
          echo "DISABLE_V8_COMPILE_CACHE=1" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: yarn build

      - name: Resolve standalone version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.standalone_version }}" ]; then
            VERSION="${{ github.event.inputs.standalone_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Stamp standalone version into package.json
        shell: node {0}
        run: |
          const fs = require('fs');
          const pkgPath = 'standalone/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = '${{ steps.version.outputs.version }}';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

      - name: Install pkg
        run: npm install -g pkg

      - name: Build Windows binary (node${{ matrix.node_version }})
        run: |
          New-Item -ItemType Directory -Force -Path dist
          pkg standalone/index.js `
            --config standalone/package.json `
            --target node${{ matrix.node_version }}-win-x64 `
            --output dist/mjml-windows-x64-node${{ matrix.node_version }}.exe

      - name: Verify binary
        run: .\dist\mjml-windows-x64-node${{ matrix.node_version }}.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mjml-windows-x64-node${{ matrix.node_version }}
          path: dist/mjml-windows-x64-node${{ matrix.node_version }}.exe

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mjml-windows-x64-node${{ matrix.node_version }}.exe
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
